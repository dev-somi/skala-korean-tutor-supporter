# 개발용: Postgres만 띄운다. 나머지 서비스는 로컬에서 실행 (ADR-0008)
services:
  postgres:
    image: postgres:16
    container_name: tutor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutor}
      POSTGRES_USER: ${POSTGRES_USER:-tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutor} -d ${POSTGRES_DB:-tutor}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
